name: Governance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  opa-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run OPA tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            openpolicyagent/opa:1.19.0 \
            test /workspace/policies -v

  schema-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run governance schema tests
        run: pytest -v
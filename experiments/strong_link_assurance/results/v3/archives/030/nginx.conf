worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    log_format native escape=json '{"msec":"$msec","request_time":"$request_time",'
      '"request_id":"$request_id","request_method":"$request_method",'
      '"request_uri":"$request_uri","status":$status,"body_bytes_sent":$body_bytes_sent,'
      '"request_completion":"$request_completion","remote_user":"$remote_user"}';
    access_log /evidence/access.jsonl native;
    server {
        listen 8080;
        server_name complaints-static;
        root /target;
        default_type application/json;
        auth_basic "complaints-static";
        auth_basic_user_file /run/target-auth;
        add_header X-Request-ID $request_id always;
        gzip off;
        max_ranges 0;
        location = /complaints/complaint-456.json { }
        location = /complaints/complaint-789.json { }
        location / { return 404; }
    }
}
